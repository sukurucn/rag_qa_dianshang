[project]
name = "rag-achivement-with-codex"
version = "0.1.0"
description = "电商问答 RAG 知识库"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "FlagEmbedding>=1.3,<2",
    "accelerate>=1.12,<2",
    "datasets>=4.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.2,<2",
    "langchain-openai>=1.1,<2",
    "pydantic-settings>=2.10,<3",
    "pypdf>=5.9,<7",
    "pymilvus>=2.5,<3",
    "PyMySQL>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.2,<2",
    "redis>=5.2,<7",
    "scikit-learn>=1.7,<2",
    "torch>=2.7,<3",
    "transformers>=5.15,<6",
    "typing-extensions>=4.15,<5",
    "uvicorn>=0.34,<1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
files = ["base"]
python_version = "3.10"
strict = true
